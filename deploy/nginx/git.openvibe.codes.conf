## ═══════════════════════════════════════════════════════════════
## OpenVibe Git — Nginx configuration (REFERENCE, NOT INSTALLED YET)
##
## Deployed to /etc/nginx/sites-available/git.openvibe.codes.conf by the cut-over. Until then Forgejo still owns
## the name. The Node app (port 5270, systemd unit openvibe-git) serves:
##
##   /<owner>/<name>.git/…     git over HTTPS (git http-backend) — clone and push
##   /api/v1/*                 the JSON API and GitHub's push webhook
##   everything else           the pages
##
## A clone and a push stream a pack in both directions: no proxy buffering, no request buffering, and a connection
## may stay open for ten minutes. The body cap matches the service's own receive.maxInputSize (512 MB).
## Never log request bodies, query strings or cookies here; the audit log is the service's, without tokens.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=git_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=git_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=git_clone:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name git.openvibe.codes;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name git.openvibe.codes;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.codes/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/git.openvibe.codes.access.log;
    error_log  /var/log/nginx/git.openvibe.codes.error.log;

    # A push is capped by the service at GIT_MAX_PUSH_BYTES (512 MB); this is the same ceiling at the edge.
    client_max_body_size 512m;
    client_body_timeout 600s;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Git over HTTPS: the wire protocol streams ─────────────────
    # /<owner>/<name>.git/… and the /git/ prefix the same app also answers.
    location ~ ^/(?:git/)?[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9._-]*\.git/ {
        limit_req zone=git_clone burst=40 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:5270;
    }

    # ── GitHub's push webhook: the body is signed as it was sent ──
    location = /api/v1/webhooks/github {
        limit_req zone=git_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5270;
    }

    location = /auth/me {
        limit_req zone=git_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5270;
    }

    location /auth/ {
        limit_req zone=git_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5270;
    }

    location /api/ {
        limit_req zone=git_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5270;
    }

    location ~* ^/metrics(/|$) { return 404; }
    location ~* ^/internal(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:5270;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
